name: Angular Build

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ main ]
  # Also on main: Render only deploys after the merge commit's checks pass, and it skips the
  # deploy entirely when a commit carries no checks.
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.9.0]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci

      # Runs before the build so a coverage regression fails fast.
      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-erd-client
          path: coverage/erd_frontend

      # Kept last: the karma builder runs with aot:false, so `ng build` is the
      # only step that actually enforces strictTemplates.
      - name: Build
        run: npm run build
